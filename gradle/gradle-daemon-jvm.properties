#
# The Gradle daemon runs on JDK 21: detekt 1.23 runs inside the daemon and its
# Kotlin compiler cannot read JDK 25's version string. Gradle picks an installed
# JDK 21 (locally and the one setup-java installs in CI); raise it with detekt 2.0.
toolchainVersion=21
