
name: Build Aloha Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: |
          sdkmanager "platforms;android-37"
          sdkmanager "platform-tools"

      - name: Allow Gradle to run
        run: chmod +x ./gradlew

      - name: Build Aloha Android APK
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aloha-Android-APK
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
