#
# Labels a pull request "AI assisted" when any commit carries an Assisted-by
# trailer, and fails it when a tool rather than a person signed a commit off:
# the Developer Certificate of Origin is a person's certification.
name: ai-trailer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailer:
    name: Inspect commit trailers
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the pull request's commits
      pull-requests: write # add the "AI assisted" label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect commit trailers
        id: inspect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          assisted=false
          for sha in $(git rev-list "$BASE..$HEAD"); do
            trailers=$(git log -1 --format='%(trailers)' "$sha")
            if printf '%s\n' "$trailers" | grep -qi '^Assisted-by:'; then assisted=true; fi
            if printf '%s\n' "$trailers" | grep -i '^Signed-off-by:' \
                | grep -qiE 'noreply@anthropic\.com|claude|copilot|chatgpt|openai|\[bot\]'; then
              echo "::error::$sha is signed off by a tool; only a person can certify the DCO"
              exit 1
            fi
          done
          echo "assisted=$assisted" >> "$GITHUB_OUTPUT"
      - name: Label
        if: steps.inspect.outputs.assisted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "AI assisted"
