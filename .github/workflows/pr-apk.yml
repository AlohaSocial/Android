#
# A QA build per pull request: the generic debug APK under its own application ID,
# signed with the QA key, as a GitHub Actions artifact (kept five days), with a QR
# code for its download and a comment linking both. The artifacts are the files
# themselves, not zips, so the link downloads a file a phone installs. Each new build
# replaces the pull request's earlier artifacts and comment, so only the latest is
# kept. A fork's pull request has neither the QA key nor a token that can comment, so
# the job is skipped there.
name: pr-apk

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: QA APK
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      actions: write # delete the pull request's earlier APK artifacts
      pull-requests: write # replace the comment linking the artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT; the default 'enhanced' provider is proprietary
      - name: Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Assemble
        run: ./gradlew assembleGenericDebug -Paloha.qa=true
      # an unzipped artifact is named after its file, so the file carries the pull request number
      - name: Name the APK after the pull request and sign it with the QA key
        id: apk
        env:
          APK: aloha-qa-pr${{ github.event.pull_request.number }}.apk
          QA_KEYSTORE: ${{ secrets.QA_KEYSTORE }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$QA_KEYSTORE" ] || [ -z "$QA_KEYSTORE_PASSWORD" ]; then
            echo "::error::set the QA_KEYSTORE and QA_KEYSTORE_PASSWORD secrets, see docs/12-conventions-quality.md"
            exit 1
          fi
          cp app/build/outputs/apk/generic/debug/*.apk "$APK"
          printf '%s' "$QA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/qa.p12"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/qa.p12" \
            --ks-pass env:QA_KEYSTORE_PASSWORD --ks-key-alias qa "$APK"
          rm "$RUNNER_TEMP/qa.p12"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" |
            sed -n "1s/.* versionCode='\([^']*\)' versionName='\([^']*\)'.*/version=\2 (\1)/p" >> "$GITHUB_OUTPUT"
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: aloha-qa-pr${{ github.event.pull_request.number }}.apk
          archive: false
          retention-days: 5
      - name: QR code for the download
        env:
          QR: aloha-qa-pr${{ github.event.pull_request.number }}-qr.png
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          sudo apt-get install -y -qq qrencode > /dev/null
          qrencode -s 8 -o "$QR" "$URL"
      - name: Upload the QR code
        id: upload-qr
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: aloha-qa-pr${{ github.event.pull_request.number }}-qr.png
          if-no-files-found: error
          archive: false
          retention-days: 5
      - name: Replace the earlier artifacts and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # the pushed commit, not the merge commit GitHub builds a pull request on
          SHA: ${{ github.event.pull_request.head.sha }}
          NAME: aloha-qa-pr${{ github.event.pull_request.number }}.apk
          QR_NAME: aloha-qa-pr${{ github.event.pull_request.number }}-qr.png
          ID: ${{ steps.upload.outputs.artifact-id }}
          QR_ID: ${{ steps.upload-qr.outputs.artifact-id }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          QR_URL: ${{ steps.upload-qr.outputs.artifact-url }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          for name in "$NAME" "$QR_NAME"; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
              --jq ".artifacts[] | select(.id != $ID and .id != $QR_ID) | .id" |
              while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- pr-apk -->"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"; done
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ### :iphone: QA build

          | | |
          |---|---|
          | **Download** | [$NAME]($URL) |
          | **QR code** | [Open the QR code for this download]($QR_URL) |
          | **Commit** | $SHA |
          | **Version** | \`$VERSION\` |
          | **Available until** | 5 days after this build |

          The QA build installs alongside any other Aloha build, so you can keep using your existing install while testing, and it updates an earlier QA build in place.

          Downloading the file requires a GitHub account, so open this link on the device you want to test on, or transfer the APK to it.
          <!-- pr-apk -->
          EOF
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
