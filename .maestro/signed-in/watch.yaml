#
# The Video tab, then a video's watch page, loaded; scripts/ui-flows.sh folds the device around it.
appId: social.aloha.android
---
- launchApp
- runFlow: system-ui.yaml
- tapOn:
    text: "Video"
    index: 0
- tapOn: "Aloha test video.*"
- extendedWaitUntil:
    visible: "Chapters"
    timeout: 20000
