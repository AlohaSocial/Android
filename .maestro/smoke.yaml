#
# Release-build smoke: the app starts past R8, and the accepted terms survive
# a restart, so DataStore and the navigation keys work after shrinking.
# Grows with the app: sign-in against the mock, timeline.
appId: social.aloha.android
---
- launchApp:
    clearState: true
# a freshly booted CI emulator often shows "System UI isn't responding" over the app; wait it out
# (text selectors match the whole text, so the pattern needs its wildcards)
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: ".*isn't responding.*"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "Before you start"
          timeout: 20000
- tapOn: "Agree and continue"
- assertVisible: "Add account"
- stopApp
- launchApp
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: ".*isn't responding.*"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "Add account"
          timeout: 20000
- assertNotVisible: "Before you start"
