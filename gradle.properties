# idle for a minute, G1 collects and hands the heap it no longer uses back to the system. The Kotlin daemon
# is set here too, as a system property: build-logic compiles first, and the daemon it starts serves the rest
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -Dfile.encoding=UTF-8 \
    -Dkotlin.daemon.jvm.options=-Xmx2g,-XX:MaxMetaspaceSize=512m,-XX:+UseG1GC,-XX:G1PeriodicGCInterval=60000 \
    -Dkotlin.daemon.options=autoshutdownIdleSeconds=600
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# the build yields the CPU to whatever the person is doing; it still takes every idle core
org.gradle.priority=low
# an idle daemon stops after ten minutes instead of three hours; the Kotlin daemon too, instead of two
org.gradle.daemon.idletimeout=600000
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The release: its name, and the counter each release raises by one. Every app's version code is its
# form-factor slot plus this counter (build-logic VersionSlots, docs/12-store.md).
aloha.versionName=0.1.0
aloha.versionBase=1
